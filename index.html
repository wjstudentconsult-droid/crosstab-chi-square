<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosstab & Chi-square</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--bd:#e5e7eb;--ok:#047857;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.6rem;margin:.2em 0}.sub{color:var(--mut);margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:4px}.lang button{padding:6px 12px;background:#e5e7eb;color:var(--ink)}.lang button.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:1.1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px}
.grid h3{grid-column:1/-1;margin:8px 0 0;font-size:1rem;color:var(--pri)}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
select,input[type=file]{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:#fff;max-width:100%}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.row>div{display:flex;flex-direction:column;gap:4px}
button{font:inherit;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:600}
.pri{background:var(--pri);color:#fff}.pri:disabled{background:#9ca3af;cursor:not-allowed}
.sec{background:#e5e7eb;color:var(--ink)}.dl{background:#ecfdf5;color:var(--ok);padding:6px 12px;font-size:.9rem}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;align-items:center}
.tabs .tab{background:#fff;border:2px solid var(--pri);color:var(--pri)}.tabs .tab.on{background:var(--pri);color:#fff}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:.95rem}
th,td{border:1px solid #cbd5e1;padding:6px 12px;text-align:center}
th{background:#eff6ff}td.l{text-align:left;font-weight:600;background:#f8fafc}td.sig{background:#fef3c7;font-weight:700}
.exp{margin-top:10px;background:#f8fafc;border-left:4px solid var(--pri);padding:10px 14px;border-radius:6px}.exp p{margin:.3em 0}
.msg{color:var(--mut);font-size:.9rem;margin-top:8px}.err{color:var(--bad)}
.ph{margin:24px 0 10px;color:var(--pri);font-size:1.15rem}
.chartbox{width:min(900px,100%);height:380px}.chartbox.sq{height:420px;width:min(520px,100%)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div>
<h1>📊 <span data-th="วิเคราะห์ Crosstab และสถิติไคสแควร์" data-en="Crosstab & Chi-square Analysis"></span></h1>
<div class="sub" data-th="อัพโหลดไฟล์ Excel → เลือกตัวแปรและสถิติ → กดประมวลผล" data-en="Upload Excel file → choose variables & statistics → click Run"></div></div>
<div class="lang"><button id="bTH" class="on">ไทย</button><button id="bEN">English</button></div></div>

<div class="card">
  <h2 data-th="1) อัพโหลดไฟล์ Excel" data-en="1) Upload Excel file"></h2>
  <input type="file" id="file" accept=".xlsx,.xls,.csv">
  <div class="msg" id="fileMsg" data-th="แถวแรกของไฟล์ต้องเป็นชื่อตัวแปร (หัวคอลัมน์)" data-en="The first row must contain variable names (column headers)"></div>
  <div id="varBox" style="display:none;margin-top:12px">
    <div class="row">
      <div><b data-th="จำนวนตัวแปรที่ใช้วิเคราะห์" data-en="Number of variables"></b><select id="nVar"></select></div>
      <div id="modeDiv" style="display:none"><b data-th="รูปแบบการจับคู่" data-en="Pairing mode"></b>
        <select id="mode"><option value="all" data-th="ทุกคู่ของตัวแปร" data-en="All pairs"></option><option value="first" data-th="ตัวแปรที่ 1 เทียบกับตัวแปรอื่น" data-en="Variable 1 vs. the others"></option></select></div>
      <div><b data-th="ระดับนัยสำคัญ (α)" data-en="Significance level (α)"></b>
        <select id="alpha"><option>0.05</option><option>0.01</option><option>0.10</option></select></div>
    </div>
    <div class="row" id="varSel" style="margin-top:10px"></div>
    <div class="msg" id="pairInfo"></div>
  </div>
</div>

<div class="card">
  <h2 data-th="2) เลือกสถิติที่ต้องการวิเคราะห์" data-en="2) Select statistics"></h2>
  <div class="grid" id="stats">
    <label class="chk"><input type="checkbox" id="ct" checked><span data-th="ตาราง Crosstab (จำนวน)" data-en="Crosstab (counts)"></span></label>
    <label class="chk"><input type="checkbox" id="rp" checked><span data-th="ร้อยละตามแถว (Row %)" data-en="Row percentages"></span></label>
    <label class="chk"><input type="checkbox" id="cp" checked><span data-th="ร้อยละตามคอลัมน์ (Column %)" data-en="Column percentages"></span></label>
    <label class="chk"><input type="checkbox" id="tp"><span data-th="ร้อยละของทั้งหมด (Total %)" data-en="Total percentages"></span></label>
    <label class="chk"><input type="checkbox" id="ex" checked><span data-th="ค่าคาดหวัง (Expected count)" data-en="Expected counts"></span></label>
    <label class="chk"><input type="checkbox" id="res"><span data-th="Adjusted Standardized Residual" data-en="Adjusted standardized residuals"></span></label>
    <label class="chk"><input type="checkbox" id="chi" checked><span>Pearson Chi-square</span></label>
    <label class="chk"><input type="checkbox" id="lr"><span>Likelihood Ratio</span></label>
    <label class="chk"><input type="checkbox" id="yf"><span data-th="Yates / Fisher's Exact (ตาราง 2×2)" data-en="Yates / Fisher's Exact (2×2 tables)"></span></label>
    <label class="chk"><input type="checkbox" id="lbl"><span data-th="Linear-by-Linear Association (ข้อมูลอันดับ)" data-en="Linear-by-Linear Association (ordinal data)"></span></label>
    <label class="chk"><input type="checkbox" id="mcn"><span data-th="McNemar (ข้อมูลคู่ 2×2)" data-en="McNemar (paired 2×2)"></span></label>
    <label class="chk"><input type="checkbox" id="orr"><span data-th="Odds Ratio / Relative Risk + 95% CI (2×2)" data-en="Odds Ratio / Relative Risk + 95% CI (2×2)"></span></label>
    <label class="chk"><input type="checkbox" id="eff" checked><span data-th="ขนาดความสัมพันธ์ (Phi, Cramér's V, C)" data-en="Effect size (Phi, Cramér's V, C)"></span></label>
    <h3 data-th="ชนิดกราฟ" data-en="Chart types"></h3>
    <label class="chk"><input type="checkbox" id="bar" checked><span data-th="กราฟแท่งเปรียบเทียบ (Clustered)" data-en="Clustered bar"></span></label>
    <label class="chk"><input type="checkbox" id="stack" checked><span data-th="กราฟแท่งซ้อน 100% (Stacked)" data-en="100% stacked bar"></span></label>
    <label class="chk"><input type="checkbox" id="hbar"><span data-th="กราฟแท่งแนวนอน" data-en="Horizontal bar"></span></label>
    <label class="chk"><input type="checkbox" id="line"><span data-th="กราฟเส้น" data-en="Line chart"></span></label>
    <label class="chk"><input type="checkbox" id="pie"><span data-th="กราฟวงกลม (ตัวแปรแถว)" data-en="Pie chart (row variable)"></span></label>
    <label class="chk"><input type="checkbox" id="dn"><span data-th="กราฟโดนัท (ตัวแปรคอลัมน์)" data-en="Doughnut (column variable)"></span></label>
  </div>
</div>

<div class="row" style="margin-bottom:16px">
  <button class="pri" id="run" disabled data-th="▶ ประมวลผล" data-en="▶ Run"></button>
  <button class="sec" id="reset" data-th="⟲ Reset" data-en="⟲ Reset"></button>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab on" id="tT" data-th="📋 นำเสนอตารางค่าสถิติ" data-en="📋 Statistical tables"></button>
  <button class="tab" id="tC" data-th="📈 นำเสนอกราฟ" data-en="📈 Charts"></button>
  <button class="dl" id="xAll" data-th="⬇ ดาวน์โหลดทุกตาราง (Excel)" data-en="⬇ Download all tables (Excel)"></button>
</div>
<div id="tPanel"></div><div id="cPanel" style="display:none"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const S={aoa:null,charts:[],models:[],errs:[],specs:[],fm:null};
let lang='th';const X=(a,b)=>lang==='th'?a:b;
const PAL=['#2563eb','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>Number(x).toFixed(d);const fp=p=>p<0.001?'< .001':f(p,3);
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};

/* ---------- สถิติ ---------- */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x);}
function gammaQ(a,x){if(x<=0)return 1;
  if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break;}
    return 1-sum*Math.exp(-x+a*Math.log(x)-lgamma(a));}
  let b=x+1-a,c=1e300,d=1/b,h=d;
  for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break;}
  return Math.exp(-x+a*Math.log(x)-lgamma(a))*h;}
const chiP=(x,df)=>gammaQ(df/2,x/2),lf=n=>lgamma(n+1);
function fisher(a,b,c,d){const r1=a+b,r2=c+d,c1=a+c,c2=b+d,n=r1+r2;
  const pr=x=>Math.exp(lf(r1)+lf(r2)+lf(c1)+lf(c2)-lf(n)-lf(x)-lf(r1-x)-lf(c1-x)-lf(r2-c1+x));
  const po=pr(a);let p=0;for(let x=Math.max(0,c1-r2);x<=Math.min(r1,c1);x++){const q=pr(x);if(q<=po*(1+1e-7))p+=q;}return Math.min(1,p);}

/* ---------- ภาษา ---------- */
function applyLang(){
  document.documentElement.lang=lang;$('bTH').classList.toggle('on',lang==='th');$('bEN').classList.toggle('on',lang==='en');
  document.querySelectorAll('[data-th]').forEach(e=>e.textContent=e.dataset[lang]);
  if(S.fm)$('fileMsg').textContent=S.fm();
  if(S.aoa){buildVars();}
  if(S.models.length||S.errs.length)render();
}
$('bTH').onclick=()=>{lang='th';applyLang();};$('bEN').onclick=()=>{lang='en';applyLang();};

/* ---------- อัพโหลด ---------- */
$('file').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=ev=>{try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    if(aoa.length<2||aoa[0].length<2)throw new Error(X('ไฟล์ต้องมีอย่างน้อย 2 คอลัมน์ และมีข้อมูล 1 แถวขึ้นไป','The file needs at least 2 columns and 1 data row'));
    S.aoa=aoa;const mk=Math.min(6,aoa[0].length);
    $('nVar').innerHTML=Array.from({length:mk-1},(_,i)=>`<option>${i+2}</option>`).join('');
    $('varSel').innerHTML='';buildVars();$('varBox').style.display='block';$('run').disabled=false;
    $('fileMsg').className='msg';S.fm=()=>X(`✔ อ่านไฟล์ "${file.name}" สำเร็จ: ${aoa.length-1} แถว, ${aoa[0].length} คอลัมน์`,`✔ Loaded "${file.name}": ${aoa.length-1} rows, ${aoa[0].length} columns`);
    $('fileMsg').textContent=S.fm();
  }catch(err){S.aoa=null;$('run').disabled=true;$('fileMsg').className='msg err';S.fm=()=>'❌ '+err.message;$('fileMsg').textContent=S.fm();}};
  rd.readAsArrayBuffer(file);
});
const vn=i=>String(S.aoa[0][i]||X('คอลัมน์ ','Column ')+(i+1));
function buildVars(){
  const k=+$('nVar').value,keep=[...document.querySelectorAll('.vs')].map(s=>s.value);
  const opts=S.aoa[0].map((h,i)=>`<option value="${i}">${esc(vn(i))}</option>`).join('');
  $('varSel').innerHTML=Array.from({length:k},(_,i)=>`<div><b>${k===2?(i?X('ตัวแปรคอลัมน์ (Column)','Column variable'):X('ตัวแปรแถว (Row)','Row variable')):X('ตัวแปรที่ ','Variable ')+(i+1)}</b><select class="vs">${opts}</select></div>`).join('');
  document.querySelectorAll('.vs').forEach((s,i)=>s.value=keep[i]!==undefined?keep[i]:i);
  $('modeDiv').style.display=k>2?'flex':'none';updInfo();
}
function updInfo(){const k=+$('nVar').value,m=k>2&&$('mode').value==='first'?k-1:k*(k-1)/2;
  $('pairInfo').textContent=X(`จะวิเคราะห์ Crosstab/ไคสแควร์ทั้งหมด ${m} คู่`,`${m} variable pair(s) will be analyzed`);}
$('nVar').onchange=buildVars;$('mode').onchange=updInfo;

/* ---------- ประมวลผล (สร้างโมเดลข้อมูล) ---------- */
$('run').onclick=()=>{
  if(!S.aoa)return;
  const alpha=+$('alpha').value;S.models=[];S.errs=[];
  const idx=[...document.querySelectorAll('.vs')].map(s=>+s.value);
  if(new Set(idx).size<idx.length){S.errs.push(()=>X('กรุณาเลือกตัวแปรแต่ละช่องให้ไม่ซ้ำกัน','Please choose a different variable in each field'));}
  else{
    const pl=[];
    if(idx.length>2&&$('mode').value==='first'){for(let j=1;j<idx.length;j++)pl.push([idx[0],idx[j]]);}
    else for(let i=0;i<idx.length;i++)for(let j=i+1;j<idx.length;j++)pl.push([idx[i],idx[j]]);
    pl.forEach(q=>{const m=analyze(q[0],q[1],alpha);if(m)S.models.push(m);});
  }
  S.sel={};document.querySelectorAll('#stats input').forEach(i=>S.sel[i.id]=i.checked);
  $('tabs').style.display='flex';render();showTab('t');$('tabs').scrollIntoView({behavior:'smooth'});
};
function analyze(ri,ci,alpha){
  const rn=vn(ri),cn=vn(ci);
  const pairs=S.aoa.slice(1).map(r=>[String(r[ri]).trim(),String(r[ci]).trim()]).filter(p=>p[0]!==''&&p[1]!=='');
  const srt=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,'th',{numeric:true}));
  const R=srt(pairs.map(p=>p[0])),C=srt(pairs.map(p=>p[1]));
  if(R.length<2||C.length<2){S.errs.push(()=>`${rn} × ${cn}: `+X('แต่ละตัวแปรต้องมีอย่างน้อย 2 กลุ่ม','each variable needs at least 2 groups'));return null;}
  if(R.length>20||C.length>20){S.errs.push(()=>`${rn} × ${cn}: `+X('มีกลุ่มมากเกินไป (เกิน 20 กลุ่ม)','too many groups (over 20)'));return null;}
  const r=R.length,c=C.length,n=pairs.length;
  const O=R.map(()=>C.map(()=>0));pairs.forEach(p=>O[R.indexOf(p[0])][C.indexOf(p[1])]++);
  const RT=O.map(x=>x.reduce((a,b)=>a+b,0)),CT=C.map((_,j)=>O.reduce((a,x)=>a+x[j],0));
  const E=O.map((x,i)=>x.map((_,j)=>RT[i]*CT[j]/n));
  const chi2=O.reduce((s,x,i)=>s+x.reduce((t,o,j)=>t+(o-E[i][j])**2/E[i][j],0),0);
  const df=(r-1)*(c-1),p=chiP(chi2,df),minE=Math.min(...E.flat()),lowN=E.flat().filter(v=>v<5).length;
  const Z=O.map((x,i)=>x.map((o,j)=>(o-E[i][j])/Math.sqrt(E[i][j]*(1-RT[i]/n)*(1-CT[j]/n))));
  const G=2*O.reduce((s,x,i)=>s+x.reduce((t,o,j)=>t+(o>0?o*Math.log(o/E[i][j]):0),0),0);
  const is22=r===2&&c===2;let y=null,pf=null;
  if(is22){y=O.reduce((s,x,i)=>s+x.reduce((t,o,j)=>t+(Math.max(0,Math.abs(o-E[i][j])-0.5))**2/E[i][j],0),0);pf=fisher(O[0][0],O[0][1],O[1][0],O[1][1]);}
  const mxs=RT.reduce((s,v,i)=>s+v*(i+1),0)/n,mys=CT.reduce((s,v,j)=>s+v*(j+1),0)/n;
  let sxy=0,sxx=0,syy=0;O.forEach((x,i)=>x.forEach((o,j)=>{sxy+=o*(i+1-mxs)*(j+1-mys);sxx+=o*(i+1-mxs)**2;syy+=o*(j+1-mys)**2;}));
  const lr_=sxy/Math.sqrt(sxx*syy),lbl={r:lr_,M2:(n-1)*lr_*lr_};lbl.p=chiP(lbl.M2,1);
  let mc=null,or2=null;
  if(is22){const b=O[0][1],cc=O[1][0],k=b+cc;let pm=1;
    if(k>0){let sm=0;for(let x=0;x<=Math.min(b,cc);x++)sm+=Math.exp(lf(k)-lf(x)-lf(k-x)-k*Math.log(2));pm=Math.min(1,2*sm);}
    mc={b,c:cc,p:pm};
    const z0=O.flat().some(v=>v===0),[a1,b1,c1,d1]=O.flat().map(v=>v+(z0?0.5:0));
    const orv=a1*d1/(b1*c1),se1=Math.sqrt(1/a1+1/b1+1/c1+1/d1),rr=(a1/(a1+b1))/(c1/(c1+d1)),se2=Math.sqrt(1/a1-1/(a1+b1)+1/c1-1/(c1+d1));
    or2={z0,or:orv,orL:Math.exp(Math.log(orv)-1.96*se1),orU:Math.exp(Math.log(orv)+1.96*se1),rr,rrL:Math.exp(Math.log(rr)-1.96*se2),rrU:Math.exp(Math.log(rr)+1.96*se2)};}
  return {lbl,mc,or2,rn,cn,R,C,r,c,n,O,RT,CT,E,Z,chi2,df,p,alpha,sig:p<alpha,minE,lowN,lowPct:lowN/(r*c)*100,G,pG:chiP(G,df),is22,y,py:y!==null?chiP(y,1):null,pf,
    phi:Math.sqrt(chi2/n),CC:Math.sqrt(chi2/(chi2+n)),V:Math.sqrt(chi2/(n*Math.min(r-1,c-1))),total:S.aoa.length-1};
}

/* ---------- สร้างตาราง ---------- */
function buildTables(m){
  const {rn,cn,R,C,O,RT,CT,E,Z,n,r,c,p,df,chi2,sig,alpha}=m,g=id=>S.sel[id],T=[];
  const mat=(cell,rowT,colT,grand)=>{
    const a=[[rn+' \\ '+cn,...C,...(rowT?[X('รวม','Total')]:[])]];
    R.forEach((x,i)=>a.push([x,...C.map((_,j)=>cell(i,j)),...(rowT?[rowT(i)]:[])]));
    if(colT)a.push([X('รวม','Total'),...C.map((_,j)=>colT(j)),...(rowT?[grand]:[])]);return a;};
  const pc=(v,t)=>f(v/t*100,1)+'%';
  let mx={v:-1};O.forEach((x,i)=>x.forEach((v,j)=>{if(v>mx.v)mx={v,i,j};}));
  const B=s=>`<b>${esc(s)}</b>`;
  if(g('ct'))T.push({title:X('ตาราง Crosstab (จำนวน)','Crosstab (Counts)'),a:mat((i,j)=>O[i][j],i=>RT[i],j=>CT[j],n),
    exp:X(`<p>ตารางแสดงจำนวนข้อมูลที่ตกอยู่ในแต่ละคู่ของ ${B(rn)} และ ${B(cn)} รวมทั้งสิ้น ${n} ราย</p><p>เซลล์ที่มีจำนวนมากที่สุดคือ ${B(R[mx.i])} ในกลุ่ม ${B(C[mx.j])} จำนวน ${mx.v} ราย (${pc(mx.v,n)} ของทั้งหมด)</p>`,
      `<p>The table shows how many cases fall in each combination of ${B(rn)} and ${B(cn)} (N = ${n}).</p><p>The largest cell is ${B(R[mx.i])} × ${B(C[mx.j])} with ${mx.v} cases (${pc(mx.v,n)} of all).</p>`)});
  if(g('rp')){const top=C.reduce((a,x,j)=>O[0][j]>O[0][a]?j:a,0);
    T.push({title:X('ร้อยละตามแถว (Row %)','Row Percentages'),a:mat((i,j)=>pc(O[i][j],RT[i]),i=>'100.0%'),
    exp:X(`<p>ร้อยละคิดภายในแต่ละกลุ่มของ ${B(rn)} เพื่อดูการกระจายไปยังกลุ่มของ ${B(cn)} เช่น ใน ${B(R[0])} มี ${B(C[top])} มากที่สุด (${pc(O[0][top],RT[0])}) ถ้าสัดส่วนระหว่างแถวต่างกันมาก อาจมีความสัมพันธ์ระหว่างตัวแปร</p>`,
      `<p>Percentages are computed within each group of ${B(rn)}. For example, within ${B(R[0])} the most common ${B(cn)} group is ${B(C[top])} (${pc(O[0][top],RT[0])}). Large differences between rows suggest an association.</p>`)});}
  if(g('cp'))T.push({title:X('ร้อยละตามคอลัมน์ (Column %)','Column Percentages'),a:mat((i,j)=>pc(O[i][j],CT[j]),null,j=>'100.0%',''),
    exp:X(`<p>ร้อยละคิดภายในแต่ละกลุ่มของ ${B(cn)} เพื่อดูองค์ประกอบของ ${B(rn)} ในแต่ละคอลัมน์ หากแต่ละคอลัมน์มีสัดส่วนใกล้เคียงกัน แสดงว่าตัวแปรมีแนวโน้มไม่สัมพันธ์กัน</p>`,
      `<p>Percentages are computed within each group of ${B(cn)}, showing the composition of ${B(rn)} in each column. Similar columns suggest no association.</p>`)});
  if(g('tp'))T.push({title:X('ร้อยละของทั้งหมด (Total %)','Total Percentages'),a:mat((i,j)=>pc(O[i][j],n),i=>pc(RT[i],n),j=>pc(CT[j],n),'100.0%'),
    exp:X(`<p>แต่ละเซลล์คือสัดส่วนของข้อมูลทั้งหมด ${n} ราย ใช้ดูภาพรวมการกระจายตัว</p>`,`<p>Each cell is the share of all ${n} cases, giving an overview of the overall distribution.</p>`)});
  if(g('ex')){const bad=m.lowPct>20||m.minE<1;
    T.push({title:X('ค่าคาดหวัง (Expected Count)','Expected Counts'),a:mat((i,j)=>f(E[i][j]),null,null),
    exp:X(`<p>จำนวนที่คาดว่าจะพบหาก ${B(rn)} และ ${B(cn)} ไม่สัมพันธ์กัน (ผลรวมแถว × ผลรวมคอลัมน์ ÷ N)</p><p>ข้อตกลงของไคสแควร์: ค่าคาดหวังควรมากกว่า 5 ในอย่างน้อย 80% ของเซลล์ และไม่มีเซลล์ใดต่ำกว่า 1 — ข้อมูลนี้มี ${m.lowN} จาก ${r*c} เซลล์ (${f(m.lowPct,1)}%) ที่ต่ำกว่า 5 ค่าต่ำสุด = ${f(m.minE)} ${bad?'<b class="err">→ ไม่เป็นไปตามข้อตกลง ควรระวังการตีความ หรือรวมกลุ่ม/ใช้ Fisher (2×2)</b>':'<b style="color:var(--ok)">→ เป็นไปตามข้อตกลง</b>'}</p>`,
      `<p>Counts expected if ${B(rn)} and ${B(cn)} were independent (row total × column total ÷ N).</p><p>Assumption: expected counts should exceed 5 in at least 80% of cells and none below 1. Here ${m.lowN} of ${r*c} cells (${f(m.lowPct,1)}%) are below 5; minimum = ${f(m.minE)} ${bad?'<b class="err">→ assumption violated; interpret with caution, merge groups, or use Fisher (2×2)</b>':'<b style="color:var(--ok)">→ assumption satisfied</b>'}</p>`)});}
  if(g('res')){const hi=[];Z.forEach((x,i)=>x.forEach((z,j)=>{if(Math.abs(z)>1.96)hi.push(`${B(R[i])} × ${B(C[j])} (z = ${f(z)}, ${z>0?X('มากกว่า','higher than'):X('น้อยกว่า','lower than')} ${X('ที่คาด','expected')})`);}));
    T.push({title:X('Adjusted Standardized Residual','Adjusted Standardized Residuals'),a:mat((i,j)=>f(Z[i][j]),null,null),hl:(i,j)=>j>0&&Math.abs(Z[i-1][j-1])>1.96,
    exp:X(`<p>ใช้ดูว่าเซลล์ใดทำให้เกิดความสัมพันธ์ เซลล์ไฮไลต์ (|z| &gt; 1.96) แตกต่างจากค่าคาดหวังอย่างมีนัยสำคัญที่ .05 (บวก = มากกว่าที่คาด, ลบ = น้อยกว่าที่คาด)</p><p>${hi.length?'เซลล์ที่แตกต่าง: '+hi.join('; '):'ไม่มีเซลล์ใดแตกต่างอย่างมีนัยสำคัญ'}</p>`,
      `<p>Shows which cells drive the association. Highlighted cells (|z| &gt; 1.96) differ significantly from expectation at .05 (positive = more than expected, negative = fewer).</p><p>${hi.length?'Significant cells: '+hi.join('; '):'No cell differs significantly from expectation.'}</p>`)});}
  if(g('chi')||g('lr')||g('yf')||g('lbl')||g('mcn')){
    const rows=[],pv=[];
    if(g('chi')){rows.push(['Pearson Chi-square',f(chi2,3),df,fp(p)]);pv.push(p);}
    if(g('lr')){rows.push(['Likelihood Ratio',f(m.G,3),df,fp(m.pG)]);pv.push(m.pG);}
    let yTxt='';
    if(g('yf')){if(m.is22){rows.push(['Continuity Correction (Yates)',f(m.y,3),1,fp(m.py)]);pv.push(m.py);rows.push([X("Fisher's Exact Test (2 ด้าน)","Fisher's Exact Test (2-sided)"),'-','-',fp(m.pf)]);pv.push(m.pf);}
      else yTxt=`<p class="err">${X(`หมายเหตุ: Yates และ Fisher ใช้ได้กับตาราง 2×2 เท่านั้น (ตารางนี้คือ ${r}×${c})`,`Note: Yates and Fisher apply to 2×2 tables only (this table is ${r}×${c})`)}</p>`;}
    let ex2='';
    if(g('lbl')){const q=m.lbl;rows.push(['Linear-by-Linear Association',f(q.M2,3),1,fp(q.p)]);pv.push(q.p);
      ex2+=X(`<p><b>Linear-by-Linear:</b> M² = ${f(q.M2,3)}, r = ${f(q.r,3)}, p ${q.p<0.001?'< .001':'= '+f(q.p,3)} — ${q.p<alpha?'พบแนวโน้มเชิงเส้นอย่างมีนัยสำคัญ':'ไม่พบแนวโน้มเชิงเส้นอย่างมีนัยสำคัญ'} (ใช้ได้เมื่อทั้งสองตัวแปรเป็นข้อมูลอันดับ โปรแกรมเรียงกลุ่มตามตัวอักษร/ตัวเลขของรหัสกลุ่ม จึงควรตรวจว่าลำดับถูกต้อง)</p>`,
        `<p><b>Linear-by-Linear:</b> M² = ${f(q.M2,3)}, r = ${f(q.r,3)}, p ${q.p<0.001?'< .001':'= '+f(q.p,3)} — ${q.p<alpha?'a significant linear trend was found':'no significant linear trend was found'} (valid only for ordinal variables; groups are ordered alphabetically/numerically by label, so check the order is meaningful).</p>`);}
    if(g('mcn')){if(m.is22){const q=m.mc;rows.push([X('McNemar (Exact binomial)','McNemar (exact binomial)'),'-','-',fp(q.p)]);pv.push(q.p);
      ex2+=X(`<p><b>McNemar:</b> ใช้เมื่อสองตัวแปรคือการวัดซ้ำในคนเดิม (เช่น ก่อน–หลัง) เซลล์ไม่สอดคล้อง ${q.b} และ ${q.c} ราย p ${q.p<0.001?'< .001':'= '+f(q.p,3)} ${q.p<alpha?'จึงมีการเปลี่ยนแปลงอย่างมีนัยสำคัญ':'จึงยังไม่พบการเปลี่ยนแปลงอย่างมีนัยสำคัญ'}</p>`,
        `<p><b>McNemar:</b> for paired measures on the same subjects (e.g. before–after). Discordant cells: ${q.b} and ${q.c}; p ${q.p<0.001?'< .001':'= '+f(q.p,3)} — ${q.p<alpha?'a significant change':'no significant change'}.</p>`);}
      else ex2+=`<p class="err">${X('McNemar ใช้ได้กับตาราง 2×2 เท่านั้น','McNemar applies to 2×2 tables only')}</p>`;}
    rows.push([X('จำนวนข้อมูลที่ใช้ (N)','Valid N'),n,'','']);
    T.push({title:X('ผลการทดสอบไคสแควร์ (Chi-square Tests)','Chi-square Tests'),a:[[X('การทดสอบ','Test'),X('ค่าสถิติ','Statistic'),'df','Sig. (p-value)'],...rows],hl:(i,j)=>j===3&&pv[i-1]<alpha,
    exp:X(`<p><b>สมมติฐาน:</b> H₀: ${esc(rn)} และ ${esc(cn)} ไม่มีความสัมพันธ์กัน | H₁: มีความสัมพันธ์กัน</p><p>Pearson χ²(${df}, N = ${n}) = ${f(chi2,3)}, p ${p<0.001?'< .001':'= '+f(p,3)} ${sig?`น้อยกว่า α = ${alpha} จึง<b style="color:var(--ok)">ปฏิเสธ H₀</b> สรุปได้ว่า ${B(rn)} มีความสัมพันธ์กับ ${B(cn)} อย่างมีนัยสำคัญทางสถิติ`:`มากกว่า α = ${alpha} จึง<b class="err">ไม่สามารถปฏิเสธ H₀</b> ยังไม่พบความสัมพันธ์ระหว่าง ${B(rn)} กับ ${B(cn)} อย่างมีนัยสำคัญ`}</p>${m.lowPct>20||m.minE<1?'<p class="err">⚠ ค่าคาดหวังต่ำกว่า 5 เกิน 20% ควรระวังการตีความ</p>':''}${yTxt}${ex2}`,
      `<p><b>Hypotheses:</b> H₀: ${esc(rn)} and ${esc(cn)} are independent | H₁: they are associated</p><p>Pearson χ²(${df}, N = ${n}) = ${f(chi2,3)}, p ${p<0.001?'< .001':'= '+f(p,3)} ${sig?`which is below α = ${alpha}, so <b style="color:var(--ok)">reject H₀</b>: ${B(rn)} is significantly associated with ${B(cn)}.`:`which is above α = ${alpha}, so <b class="err">fail to reject H₀</b>: no significant association between ${B(rn)} and ${B(cn)}.`}</p>${m.lowPct>20||m.minE<1?'<p class="err">⚠ More than 20% of expected counts are below 5; interpret with caution.</p>':''}${yTxt}${ex2}`)});}
  if(g('orr')){const q=m.or2,fx=v=>f(v,3),ttl=X('Odds Ratio และ Relative Risk (ตาราง 2×2)','Odds Ratio & Relative Risk (2×2)');
    if(!q)T.push({title:ttl,a:[[X('หมายเหตุ','Note')],[X('ใช้ได้กับตาราง 2×2 เท่านั้น','Available for 2×2 tables only')]],exp:''});
    else{const sg=(l,u)=>l>1||u<1;
      T.push({title:ttl,a:[[X('ค่าสถิติ','Statistic'),X('ค่า','Value'),X('95% CI ต่ำสุด','95% CI lower'),X('95% CI สูงสุด','95% CI upper')],
        ['Odds Ratio',fx(q.or),fx(q.orL),fx(q.orU)],[X(`Relative Risk (${C[0]}: ${R[0]} เทียบ ${R[1]})`,`Relative Risk (${C[0]}: ${R[0]} vs ${R[1]})`),fx(q.rr),fx(q.rrL),fx(q.rrU)]],
        exp:X(`<p>Odds Ratio = ${fx(q.or)} หมายถึง โอกาส (odds) ที่จะเป็น ${B(C[0])} ในกลุ่ม ${B(R[0])} เป็น ${fx(q.or)} เท่าของกลุ่ม ${B(R[1])} ${sg(q.orL,q.orU)?'ช่วงความเชื่อมั่น 95% ไม่คร่อม 1 แสดงว่าแตกต่างอย่างมีนัยสำคัญ':'ช่วงความเชื่อมั่น 95% คร่อม 1 แสดงว่ายังไม่แตกต่างอย่างมีนัยสำคัญ'}</p><p>Relative Risk = ${fx(q.rr)} คือสัดส่วนความเสี่ยงของ ${B(C[0])} ระหว่างสองกลุ่ม (1 = ไม่ต่างกัน) ${sg(q.rrL,q.rrU)?'CI ไม่คร่อม 1':'CI คร่อม 1'}</p>${q.z0?'<p class="err">มีเซลล์ที่เป็น 0 จึงบวก 0.5 ทุกเซลล์ก่อนคำนวณ (Haldane)</p>':''}`,
          `<p>Odds Ratio = ${fx(q.or)}: the odds of ${B(C[0])} in ${B(R[0])} are ${fx(q.or)} times those in ${B(R[1])}. ${sg(q.orL,q.orU)?'The 95% CI excludes 1, so the difference is significant.':'The 95% CI includes 1, so the difference is not significant.'}</p><p>Relative Risk = ${fx(q.rr)}: ratio of the risk of ${B(C[0])} between the two groups (1 = no difference). ${sg(q.rrL,q.rrU)?'CI excludes 1.':'CI includes 1.'}</p>${q.z0?'<p class="err">A cell is 0, so 0.5 was added to every cell (Haldane correction).</p>':''}`)});}}
  if(g('eff')){const V=m.V,lvl=v=>v<0.1?X('น้อยมาก (แทบไม่มี)','negligible'):v<0.3?X('น้อย','weak'):v<0.5?X('ปานกลาง','moderate'):X('มาก','strong');
    T.push({title:X('ขนาดความสัมพันธ์ (Symmetric Measures)','Effect Size (Symmetric Measures)'),
    a:[[X('ค่าสถิติ','Statistic'),X('ค่า','Value'),'Approx. Sig.'],['Phi (φ)',f(m.phi,3),fp(p)],["Cramér's V",f(V,3),fp(p)],['Contingency Coefficient (C)',f(m.CC,3),fp(p)]],
    exp:X(`<p>ไคสแควร์บอกว่า "มีความสัมพันธ์หรือไม่" แต่ Cramér's V บอก "ความแรง" (0 = ไม่สัมพันธ์, 1 = สมบูรณ์)</p><p>Cramér's V = ${f(V,3)} อยู่ในระดับ <b>${lvl(V)}</b> (โดยประมาณ: &lt; .10 น้อยมาก, .10–.29 น้อย, .30–.49 ปานกลาง, ≥ .50 มาก) ${sig?'':'แต่ผลทดสอบไม่มีนัยสำคัญ จึงไม่ควรสรุปว่ามีความสัมพันธ์ในประชากร'}</p><p>Phi เหมาะกับตาราง 2×2 ส่วน Cramér's V ใช้ได้กับทุกขนาด</p>`,
      `<p>Chi-square tells whether an association exists; Cramér's V tells its strength (0 = none, 1 = perfect).</p><p>Cramér's V = ${f(V,3)} → <b>${lvl(V)}</b> (rough guide: &lt; .10 negligible, .10–.29 weak, .30–.49 moderate, ≥ .50 strong). ${sig?'':'The test is not significant, so do not conclude an association in the population.'}</p><p>Phi suits 2×2 tables; Cramér's V works for any size.</p>`)});}
  return T;
}

/* ---------- แสดงผล ---------- */
const tblHTML=(sp)=>{const a=sp.a;return '<table><thead><tr>'+a[0].map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>'+
  a.slice(1).map((r,i)=>'<tr>'+r.map((x,j)=>`<td class="${j?'':'l'}${sp.hl&&sp.hl(i+1,j)?' sig':''}">${esc(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';};
function render(){
  S.charts.forEach(c=>c.destroy());S.charts=[];S.specs=[];
  const tp=$('tPanel'),cp=$('cPanel');tp.innerHTML=cp.innerHTML='';
  S.errs.forEach(e=>tp.insertAdjacentHTML('beforeend',`<div class="card err">${esc(e())}</div>`));
  const M=S.models;
  if(M.length>1){
    const k=M.length,ab=M[0].alpha/k,ns=M.filter(x=>x.sig).length,nb=M.filter(x=>x.p<ab).length,top=M.reduce((a,x)=>x.V>a.V?x:a,M[0]);
    addTable({title:X('สรุปผลไคสแควร์ทุกคู่ตัวแปร','Summary of all variable pairs'),
      a:[[X('คู่ตัวแปร','Pair'),X('ขนาดตาราง','Table size'),'N','χ²','df','p-value',"Cramér's V",X(`ผล (α = ${M[0].alpha})`,`Result (α = ${M[0].alpha})`)],
        ...M.map(x=>[x.rn+' × '+x.cn,x.r+'×'+x.c,x.n,f(x.chi2,3),x.df,fp(x.p),f(x.V,3),x.sig?X('สัมพันธ์','Associated'):X('ไม่สัมพันธ์','Not associated')])],
      hl:(i,j)=>j===5&&M[i-1].sig,
      exp:X(`<p>จากการทดสอบ ${k} คู่ พบความสัมพันธ์อย่างมีนัยสำคัญ <b>${ns}</b> คู่ คู่ที่แรงที่สุดคือ <b>${esc(top.rn)} × ${esc(top.cn)}</b> (V = ${f(top.V,3)})</p><p>เมื่อทดสอบหลายคู่ ความเสี่ยง Type I สูงขึ้น หากปรับด้วย Bonferroni (α' = ${M[0].alpha}/${k} = ${f(ab,4)}) จะมี <b>${nb}</b> คู่ที่ยังมีนัยสำคัญ</p>`,
        `<p>Of ${k} pairs tested, <b>${ns}</b> showed a significant association. The strongest is <b>${esc(top.rn)} × ${esc(top.cn)}</b> (V = ${f(top.V,3)}).</p><p>Multiple testing inflates Type I error. With a Bonferroni correction (α' = ${M[0].alpha}/${k} = ${f(ab,4)}), <b>${nb}</b> pair(s) remain significant.</p>`)},0,'');
  }
  M.forEach((m,k)=>{
    const h=M.length>1?`<h2 class="ph">${X('คู่ที่','Pair')} ${k+1}/${M.length}: ${esc(m.rn)} × ${esc(m.cn)}</h2>`:'';
    tp.insertAdjacentHTML('beforeend',h);cp.insertAdjacentHTML('beforeend',h);
    tp.insertAdjacentHTML('beforeend',`<div class="card"><b>${X('สรุปข้อมูล:','Data summary:')}</b> ${X(`ใช้ข้อมูลที่สมบูรณ์ ${m.n} จาก ${m.total} แถว | ตัวแปรแถว: <b>${esc(m.rn)}</b> (${m.r} กลุ่ม) | ตัวแปรคอลัมน์: <b>${esc(m.cn)}</b> (${m.c} กลุ่ม) | α = ${m.alpha}`,
      `${m.n} of ${m.total} rows used | Row variable: <b>${esc(m.rn)}</b> (${m.r} groups) | Column variable: <b>${esc(m.cn)}</b> (${m.c} groups) | α = ${m.alpha}`)}</div>`);
    buildTables(m).forEach(sp=>addTable(sp,k+1,' ['+m.rn+' × '+m.cn+']'));
    buildCharts(m,cp);
  });
}
function addTable(sp,pair,tag=''){
  const id=S.specs.push({...sp,pair})-1;
  $('tPanel').insertAdjacentHTML('beforeend',`<div class="card"><div class="head"><h2>${esc(sp.title+tag)}</h2><button class="dl" data-x="${id}">⬇ Excel</button></div>
    <div class="scroll">${tblHTML(sp)}</div><div class="exp"><b>${X('คำอธิบายผลการวิเคราะห์','Interpretation')}</b>${sp.exp}</div></div>`);
}
function sheetOf(sp,id){const rows=sp.a.map(r=>r.slice());rows.push([],[X('คำอธิบาย: ','Notes: ')+strip(sp.exp)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=sp.a[0].map((_,j)=>({wch:j?14:30}));
  return {ws,name:(`${id+1}_`+sp.title).replace(/[\\/?*\[\]:]/g,'').slice(0,31)};}
function saveX(ids,fn){const wb=XLSX.utils.book_new();ids.forEach(i=>{const s=sheetOf(S.specs[i],i);XLSX.utils.book_append_sheet(wb,s.ws,s.name);});XLSX.writeFile(wb,fn+'.xlsx');}
$('tPanel').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b)saveX([+b.dataset.x],'table_'+(+b.dataset.x+1));});
$('xAll').onclick=()=>{if(S.specs.length)saveX(S.specs.map((_,i)=>i),'crosstab_tables');};

/* ---------- กราฟ ---------- */
const CH=[['bar',['กราฟแท่งเปรียบเทียบ (Clustered Bar)','Clustered Bar Chart']],['stack',['กราฟแท่งซ้อน 100% (Stacked Bar)','100% Stacked Bar Chart']],
  ['hbar',['กราฟแท่งแนวนอน (Horizontal Bar)','Horizontal Bar Chart']],['line',['กราฟเส้น (Line Chart)','Line Chart']],
  ['pie',['กราฟวงกลม (Pie Chart)','Pie Chart']],['dn',['กราฟโดนัท (Doughnut Chart)','Doughnut Chart']]];
function buildCharts(m,cp){
  const {rn,cn,R,C,O,RT,CT,n,sig}=m;
  CH.forEach(([k,ttl])=>{
    if(!S.sel[k])return;const title=X(...ttl),round=k==='pie'||k==='dn';
    const ex={bar:X(`<p>เปรียบเทียบจำนวนในแต่ละกลุ่มของ ${esc(cn)} ภายใต้แต่ละกลุ่มของ ${esc(rn)}</p>`,`<p>Compares counts of each ${esc(cn)} group within every ${esc(rn)} group.</p>`),
      stack:X(`<p>แสดงสัดส่วน (%) ของ ${esc(cn)} ภายในแต่ละกลุ่มของ ${esc(rn)} ถ้าสัดส่วนสีในแต่ละแท่งต่างกันมาก แสดงว่าอาจมีความสัมพันธ์${sig?' สอดคล้องกับผลไคสแควร์ที่มีนัยสำคัญ':' แต่ผลไคสแควร์ไม่มีนัยสำคัญ ความต่างที่เห็นอาจเกิดจากความแปรปรวนของตัวอย่าง'}</p>`,
        `<p>Shows the percentage of ${esc(cn)} within each ${esc(rn)} group. Very different colour proportions across bars suggest an association${sig?', consistent with the significant chi-square result.':', but the chi-square test is not significant, so differences may be sampling variation.'}</p>`),
      hbar:X(`<p>เหมือนกราฟแท่งเปรียบเทียบ แต่แสดงแนวนอน เหมาะกับชื่อกลุ่มที่ยาว</p>`,`<p>Same as the clustered bar but horizontal, useful for long group labels.</p>`),
      line:X(`<p>เส้นแต่ละเส้นคือกลุ่มของ ${esc(cn)} ใช้ดูแนวโน้มและรูปแบบการเปลี่ยนแปลงตามกลุ่มของ ${esc(rn)}</p>`,`<p>Each line is a ${esc(cn)} group, showing the pattern across ${esc(rn)} groups.</p>`),
      pie:X(`<p>สัดส่วนของแต่ละกลุ่มของ ${esc(rn)} เทียบกับข้อมูลทั้งหมด ${n} ราย</p>`,`<p>Share of each ${esc(rn)} group out of all ${n} cases.</p>`),
      dn:X(`<p>สัดส่วนของแต่ละกลุ่มของ ${esc(cn)} เทียบกับข้อมูลทั้งหมด ${n} ราย</p>`,`<p>Share of each ${esc(cn)} group out of all ${n} cases.</p>`)}[k];
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="head"><h2>${esc(title)} [${esc(rn)} × ${esc(cn)}]</h2><button class="dl">⬇ PNG</button></div>
      <div class="scroll"><div class="chartbox${round?' sq':''}"><canvas></canvas></div></div><div class="exp"><b>${X('คำอธิบายกราฟ','Chart description')}</b>${ex}</div>`;
    cp.appendChild(d);
    const ff={family:'Sarabun'},ax=(t,st)=>({stacked:st,beginAtZero:true,title:{display:true,text:t,font:ff}});
    let cfg;
    if(round){const L=k==='pie'?R:C,V=k==='pie'?RT:CT;
      cfg={type:k==='pie'?'pie':'doughnut',data:{labels:L,datasets:[{data:V,backgroundColor:L.map((_,i)=>PAL[i%PAL.length])}]},options:{plugins:{title:{display:true,text:k==='pie'?rn:cn,font:{size:15,...ff}},legend:{labels:{font:ff}}}}};
    }else{
      const st=k==='stack',h=k==='hbar',type=k==='line'?'line':'bar';
      cfg={type,data:{labels:R,datasets:C.map((cl,j)=>({label:cn+': '+cl,backgroundColor:PAL[j%PAL.length],borderColor:PAL[j%PAL.length],tension:.25,
        data:R.map((_,i)=>st?+(O[i][j]/RT[i]*100).toFixed(1):O[i][j])}))},
        options:{indexAxis:h?'y':'x',plugins:{title:{display:true,text:`${rn} × ${cn}`,font:{size:15,...ff}},legend:{labels:{font:ff}}},
          scales:{x:h?{...ax(st?X('ร้อยละ (%)','Percent (%)'):X('จำนวน','Count'),st),max:st?100:undefined}:{stacked:st,title:{display:true,text:rn,font:ff}},
                  y:h?{stacked:st,title:{display:true,text:rn,font:ff}}:{...ax(st?X('ร้อยละ (%)','Percent (%)'):X('จำนวน','Count'),st),max:st?100:undefined}}}};
    }
    cfg.options.responsive=true;cfg.options.maintainAspectRatio=false;cfg.options.animation=false;
    const ch=new Chart(d.querySelector('canvas'),cfg);S.charts.push(ch);
    d.querySelector('.dl').onclick=()=>{ // PNG พื้นขาว
      const src=ch.canvas,cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(src,0,0);
      const a=document.createElement('a');a.download=`${k}_${rn}_${cn}.png`.replace(/[^\wก-๙.]+/g,'_');a.href=cv.toDataURL('image/png');a.click();};
  });
  if(!CH.some(([k])=>S.sel[k]))cp.insertAdjacentHTML('beforeend',`<div class="card msg">${X('ยังไม่ได้เลือกชนิดกราฟ','No chart type selected')}</div>`);
}

/* ---------- แท็บ & Reset ---------- */
function showTab(t){$('tPanel').style.display=t==='t'?'':'none';$('cPanel').style.display=t==='c'?'':'none';
  $('tT').classList.toggle('on',t==='t');$('tC').classList.toggle('on',t==='c');$('xAll').style.display=t==='t'?'':'none';
  if(t==='c')S.charts.forEach(c=>c.resize());}
$('tT').onclick=()=>showTab('t');$('tC').onclick=()=>showTab('c');
$('reset').onclick=()=>{
  S.charts.forEach(c=>c.destroy());S.charts=[];S.aoa=null;S.models=[];S.errs=[];S.specs=[];S.fm=null;
  $('tPanel').innerHTML=$('cPanel').innerHTML='';$('tabs').style.display='none';$('file').value='';$('varBox').style.display='none';
  $('varSel').innerHTML='';$('nVar').innerHTML='';$('mode').selectedIndex=0;$('alpha').selectedIndex=0;$('run').disabled=true;
  $('fileMsg').className='msg';$('fileMsg').textContent=$('fileMsg').dataset[lang];
  const def=['ct','rp','cp','ex','chi','eff','bar','stack'];
  document.querySelectorAll('#stats input').forEach(i=>i.checked=def.includes(i.id));
  window.scrollTo({top:0,behavior:'smooth'});
};
applyLang();
</script>
